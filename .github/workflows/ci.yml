name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ===================================================================
  #  Sirlar tekshiruvi — kalit repozitoriyaga tushmaganini kafolatlaydi
  # ===================================================================
  secrets:
    name: Sirlar tekshiruvi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kuzatilayotgan fayllar
        run: sh scripts/scan-secrets.sh

      - name: Git tarixi
        run: sh scripts/scan-secrets.sh --history

  # ===================================================================
  #  Backend — lint, migratsiya, testlar
  # ===================================================================
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zehno_ci
          POSTGRES_USER: zehno
          POSTGRES_PASSWORD: zehno_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zehno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: zehno_ci
      POSTGRES_USER: zehno
      POSTGRES_PASSWORD: zehno_ci_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ci-placeholder
      RATE_LIMIT_ENABLED: "false"
      VIDEO_PROVIDER: mock
      PAYMENT_PROVIDER: mock
      CRM_PROVIDER: mock
      TELEGRAM_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Bog'liqliklar
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app alembic tests

      - name: Formatlash (ruff format)
        run: ruff format --check app alembic tests

      - name: Migratsiyalarni qo'llash
        run: alembic upgrade head

      - name: Migratsiya modellarga mosmi (alembic check)
        run: alembic check

      - name: Migratsiya orqaga qaytadimi
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Testlar
        run: pytest -q

      - name: Seed ishlaydimi
        run: python -m app.cli seed

      - name: Ilova ishga tushadimi
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              curl -s http://127.0.0.1:8000/health
              echo ""
              curl -sf http://127.0.0.1:8000/openapi.json > /dev/null && echo "OpenAPI OK"
              exit 0
            fi
            sleep 2
          done
          echo "API 60 soniyada ko'tarilmadi"
          exit 1

  # ===================================================================
  #  Frontend — typecheck, lint, build
  # ===================================================================
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Bog'liqliklar
        run: npm ci

      - name: Tiplar (tsc)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_NAME: Zehno.uz

  # ===================================================================
  #  Docker obrazlar quriladimi (push qilinmaydi)
  # ===================================================================
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./apps/api
          - name: web
            context: ./apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: production
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # ===================================================================
  #  Compose konfiguratsiyasi to'g'rimi
  # ===================================================================
  compose:
    name: Compose validatsiya
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .env.example dan .env
        run: cp .env.example .env

      - name: docker-compose.yml
        run: docker compose config --quiet

      - name: docker-compose.peertube.yml
        run: PEERTUBE_SECRET=ci-placeholder docker compose -f docker-compose.peertube.yml config --quiet
