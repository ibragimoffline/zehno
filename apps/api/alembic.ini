[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# DSN `alembic/env.py` ichida `app.core.config.settings` dan olinadi

[post_write_hooks]
# Generatsiya qilingan migratsiyani avtomatik formatlash (ixtiyoriy).
# Yoqish uchun quyidagi qatorlarni izohdan chiqaring — `ruff` o'rnatilgan bo'lishi kerak:
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
