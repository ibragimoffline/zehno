[project]
name = "zehno-api"
version = "0.1.0"
description = "Zehno.uz — online ta'lim marketplace platformasi API (FastAPI)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = [
    "B008",     # FastAPI Depends()/File() default qiymatlari
    "B904",     # `raise ... from` har joyda talab qilinmaydi
    "ASYNC109", # httpx timeout parametrini uzatish ataylab
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
